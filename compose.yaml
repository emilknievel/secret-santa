services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./public:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    # No published ports by default. To reach it from a tunnel you already run,
    # add a compose.override.yaml (see README).

  # Only for a dedicated tunnel: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
